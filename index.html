<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:sans-serif;
  background:linear-gradient(135deg,#1b1b2f,#16213e);
  color:#fff;
  min-height:100vh;
}

header{
  text-align:center;
  padding:30px 15px;
}

header h1{
  font-size:42px;
  color:#ffd166;
  margin-bottom:10px;
}

header p{
  color:#eee;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.ad-area{
  background:#fff;
  padding:15px;
  border-radius:18px;
  margin-bottom:20px;
}

.quiz-box{
  background:#0f3460;
  border-radius:24px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

.top{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.badge,.score{
  padding:10px 18px;
  border-radius:999px;
  font-weight:bold;
}

.badge{
  background:#ffd166;
  color:#222;
}

.score{
  background:#06d6a0;
  color:#05251c;
}

.progress{
  width:100%;
  height:12px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:25px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd166,#ef476f);
  transition:0.3s;
}

#question{
  font-size:28px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:25px;
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice-btn{
  border:none;
  background:#1a4f85;
  color:#fff;
  border:2px solid #4ea8de;
  padding:18px;
  border-radius:18px;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
  transition:0.2s;
}

.choice-btn:hover{
  background:#256fb3;
  transform:translateY(-2px);
}

.correct{
  background:#06d6a0 !important;
  border-color:#06d6a0 !important;
  color:#05251c !important;
}

.wrong{
  background:#ef476f !important;
  border-color:#ef476f !important;
}

#result{
  margin-top:22px;
  font-size:22px;
  font-weight:bold;
  min-height:40px;
}

.final{
  text-align:center;
  padding:40px 10px;
}

.final h2{
  font-size:40px;
  margin-bottom:20px;
  color:#ffd166;
}

.final p{
  font-size:24px;
  margin-bottom:20px;
}

.restart-btn{
  border:none;
  background:#ffd166;
  color:#222;
  padding:15px 30px;
  border-radius:999px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:700px){
  .choices{
    grid-template-columns:1fr;
  }

  #question{
    font-size:22px;
  }
}
</style>
</head>

const TOTAL = 50;

let selectedQuestions = [];
let current = 0;
let score = 0;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");
const countEl = document.getElementById("count");
const scoreEl = document.getElementById("score");
const progressBar = document.getElementById("progressBar");
const quizBox = document.getElementById("quizBox");

function shuffle(array){
  const arr = [...array];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showQuestion(){
  const q = selectedQuestions[current];

  resultEl.innerHTML = "";
  questionEl.innerHTML = q.q;

  countEl.innerHTML = (current + 1) + " / " + TOTAL;
  scoreEl.innerHTML = "正解数 " + score;
  progressBar.style.width = ((current) / TOTAL) * 100 + "%";

  choicesEl.innerHTML = "";

  shuffle(q.choices).forEach(choice=>{
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = choice;
    btn.onclick = () => checkAnswer(btn, choice, q.a);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(btn, selected, correct){
  const buttons = document.querySelectorAll(".choice-btn");

  buttons.forEach(b=>{
    b.disabled = true;

    if(b.innerHTML === correct){
      b.classList.add("correct");
    }
  });

  if(selected === correct){
    score++;
    btn.classList.add("correct");
    resultEl.innerHTML = "✅ 正解！";
    resultEl.style.color = "#06d6a0";
  }else{
    btn.classList.add("wrong");
    resultEl.innerHTML = "❌ 不正解！ 正解は「" + correct + "」";
    resultEl.style.color = "#ef476f";
  }

  scoreEl.innerHTML = "正解数 " + score;
  progressBar.style.width = ((current + 1) / TOTAL) * 100 + "%";

  setTimeout(()=>{
    current++;

    if(current >= TOTAL){
      showFinal();
    }else{
      showQuestion();
    }
  },900);
}

function showFinal(){
  const percent = Math.round((score / TOTAL) * 100);

  quizBox.innerHTML = `
    <div class="final">
      <h2>🎉 クイズ終了！</h2>
      <p>${score} / ${TOTAL} 問正解！</p>
      <p>正答率 ${percent}%</p>
      <button class="restart-btn" onclick="location.reload()">もう一度遊ぶ</button>
    </div>
  `;
}
